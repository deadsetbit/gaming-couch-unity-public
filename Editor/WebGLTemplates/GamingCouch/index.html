<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111318;
      color: #f4f6fa;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #app-root,
    #game-canvas {
      width: 100%;
      height: 100%;
    }

    #app-root {
      position: fixed;
      inset: 0;
      display: flex;
    }

    #game-canvas {
      display: block;
      background: #111318;
      outline: none;
    }

    #status {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #111318;
      pointer-events: none;
    }

    #status[hidden] {
      display: none;
    }

    .status-panel {
      width: min(320px, 100%);
      display: grid;
      gap: 12px;
      text-align: center;
    }

    .progress-track {
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(244, 246, 250, 0.18);
    }

    .progress-fill {
      width: 100%;
      height: 100%;
      transform: scaleX(0);
      transform-origin: left center;
      background: #f4f6fa;
      transition: transform 160ms ease;
    }

    #status-label {
      min-height: 20px;
      margin: 0;
      color: rgba(244, 246, 250, 0.78);
      font-size: 14px;
      line-height: 20px;
    }

    #error-message {
      display: none;
      margin: 0;
      color: #ffb4a8;
      font-size: 14px;
      line-height: 20px;
      overflow-wrap: anywhere;
    }

    #status.is-error .progress-track,
    #status.is-error #status-label {
      display: none;
    }

    #status.is-error #error-message {
      display: block;
    }
  </style>
</head>
<body>
  <div id="app-root">
    <canvas id="game-canvas" tabindex="-1"></canvas>
  </div>

  <div id="status" role="status" aria-live="polite">
    <div class="status-panel">
      <div class="progress-track" aria-hidden="true">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <p id="status-label">Loading 0%</p>
      <p id="error-message"></p>
    </div>
  </div>

  <script>
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    const config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: "{{{ COMPANY_NAME }}}",
      productName: "{{{ PRODUCT_NAME }}}",
      productVersion: "{{{ PRODUCT_VERSION }}}"
    };

    const canvas = document.getElementById("game-canvas");
    const status = document.getElementById("status");
    const statusLabel = document.getElementById("status-label");
    const progressFill = document.getElementById("progress-fill");
    const errorMessage = document.getElementById("error-message");

    function showError(message) {
      const text = typeof message === "string" && message.length > 0
        ? message
        : "Something went wrong while starting the game.";

      errorMessage.textContent = text;
      status.classList.add("is-error");
      status.hidden = false;
    }

    function updateProgress(progress) {
      const clampedProgress = Math.max(0, Math.min(1, progress || 0));
      progressFill.style.transform = "scaleX(" + clampedProgress + ")";
      statusLabel.textContent = "Loading " + Math.round(clampedProgress * 100) + "%";
    }

    const loaderScript = document.createElement("script");
    loaderScript.src = loaderUrl;
    loaderScript.onload = function () {
      createUnityInstance(canvas, config, updateProgress)
        .then(function () {
          status.hidden = true;
          canvas.focus();
        })
        .catch(showError);
    };
    loaderScript.onerror = function () {
      showError("Build loader could not be loaded.");
    };

    document.body.appendChild(loaderScript);
  </script>
</body>
</html>
